# =============================================================================
# Demo-Backend gegen den Schul-Keycloak
#
# Es meldet sich NIE selbst an. Es bekommt Tokens vom Frontend im
# Authorization-Header und prueft sie - deshalb "service" und nicht "web-app".
# Der Client demo-backend hat im Keycloak entsprechend KEINEN aktivierten
# Ablauf; er ist nur der Name, der in der Zielgruppe des Tokens steht.
# =============================================================================

quarkus.oidc.auth-server-url=https://auth-dev.htl-leonding.ac.at/realms/htl-leonding
quarkus.oidc.client-id=demo-backend
quarkus.oidc.application-type=service

# -----------------------------------------------------------------------------
# DIE WICHTIGSTE ZEILE DIESER DATEI
#
# Ohne sie akzeptiert das Backend JEDES gueltige Token dieses Realms - auch
# eines, das fuer ein voellig anderes Projekt ausgestellt wurde. Ein anderes
# Schuelerprojekt koennte dann ein Token seiner eigenen Anwendung nehmen und
# damit hier hereinspazieren; die Signatur stimmt ja.
#
# aud = fuer wen ist dieses Token gedacht. Der Zielgruppen-Mapper am
# Frontend-Client traegt "demo-backend" ein, und hier wird es geprueft.
# Beides zusammen ergibt die Grenze - getrennte Clients allein genuegen nicht.
# -----------------------------------------------------------------------------
quarkus.oidc.token.audience=demo-backend

# -----------------------------------------------------------------------------
# DIE ZWEITWICHTIGSTE ZEILE - ohne sie liefert /api/teachers-only 403, OBWOHL
# das Token die Rolle traegt.
#
# Quarkus liest Rollen ohne diese Angabe zuerst aus dem groups-Claim und kehrt
# zurueck, SOBALD der nicht leer ist; realm_access/roles kommt nur bei leerem
# groups an die Reihe. Unser Token hat einen gefuellten groups-Claim - der
# Client Scope "classes" traegt die Klassen- und Lehrergruppen ein. Damit sind
# die Rollen der Anwendung die Gruppenpfade (/staff/teachers, /classes/...),
# und "teacher" ist nie dabei. Siehe Befund 63.
#
# Die Gruppen bleiben ueber jwt.getClaim("groups") lesbar - /api/my-class
# benutzt genau das und ist von dieser Zeile nicht betroffen.
# -----------------------------------------------------------------------------
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Das Frontend laeuft auf einem anderen Port und ist damit eine andere Herkunft.
# Ohne diese Freigabe lehnt der BROWSER die Antwort ab, bevor die Anwendung sie
# sieht - der Fehler steht dann in der Browser-Konsole und nicht im Server-Log.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8000,http://localhost:4200,http://localhost:5173
quarkus.http.cors.headers=authorization,content-type

quarkus.http.port=8080

# Im Entwicklungsbetrieb mitschreiben, warum ein Aufruf 401 statt 200 liefert.
%dev.quarkus.log.category."io.quarkus.oidc".level=DEBUG

# =============================================================================
# Stufe 5 - Benutzerlisten ueber ein DIENSTKONTO
#
# Bis hierher hat das Backend nie selbst mit Keycloak gesprochen: Es bekam
# Tokens vom Frontend und prueft sie. Ab hier ruft es die
# Verwaltungsschnittstelle selbst auf - und dafuer braucht es eine eigene
# Identitaet, naemlich das Dienstkonto des Clients demo-backend.
#
# Das Token der angemeldeten Lehrkraft taugt dafuer NICHT. Lehrkraefte haben
# im Realm keine Verwaltungsrechte, und das soll so bleiben.
# =============================================================================
quarkus.oidc-client.auth-server-url=https://auth-dev.htl-leonding.ac.at/realms/htl-leonding
quarkus.oidc-client.client-id=demo-backend
quarkus.oidc-client.credentials.secret=${KC_DEMO_BACKEND_SECRET:fehlt}
# grant.type=client bedeutet client_credentials: Das Backend meldet sich als es
# selbst an, ohne Benutzer und ohne Weiterleitung.
quarkus.oidc-client.grant.type=client

# Die Basis-URL der Verwaltungsschnittstelle. /admin/realms/<realm> - NICHT
# /realms/<realm>, das ist der oeffentliche Teil fuer Anmeldungen.
quarkus.rest-client.keycloak-admin.url=https://auth-dev.htl-leonding.ac.at/admin/realms/htl-leonding

# -----------------------------------------------------------------------------
# Das Secret steht NICHT in dieser Datei.
#
# Es kommt aus der Umgebung; im Entwicklungsbetrieb aus einer .env neben der
# pom.xml, die per .gitignore ausgeschlossen ist:
#
#     KC_DEMO_BACKEND_SECRET=<Wert aus dem Schluesselbund>
#
# Faellt die Variable weg, meldet sich das Dienstkonto mit "fehlt" an und
# bekommt 401 - der Endpunkt sagt dann, woran es liegt, statt einen 500er zu
# werfen.
# -----------------------------------------------------------------------------
